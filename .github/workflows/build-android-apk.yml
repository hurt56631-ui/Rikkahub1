name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Restore missing upstream build files
        shell: bash
        run: |
          set -euo pipefail

          # Some source ZIPs omit the Gradle version catalog. Fetch the matching
          # file from upstream so GitHub Actions can still build the project.
          if [ ! -s gradle/libs.versions.toml ]; then
            mkdir -p gradle
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/rikkahub/rikkahub/master/gradle/libs.versions.toml \
              --output gradle/libs.versions.toml
          fi

          # A ZIP upload does not preserve git submodule metadata as a gitlink.
          # Populate Material Color Utilities when checkout --submodules could not.
          if [ ! -d material3/material-color-utilities/kotlin ]; then
            rm -rf material3/material-color-utilities
            git clone --depth 1 \
              https://github.com/material-foundation/material-color-utilities.git \
              material3/material-color-utilities
          fi

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret is not configured; using a build-only dummy config."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-local-build",
              "storage_bucket": "rikkahub-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:debug000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "api_key": [
                  { "current_key": "AIzaSyDummyBuildOnlyKey000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:release0000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  { "current_key": "AIzaSyDummyBuildOnlyKey000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepare release signing
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_BASE64:-}" ] || [ -z "${SIGNING_CONFIG:-}" ]; then
            echo "Release build requires repository secrets KEY_BASE64 and SIGNING_CONFIG."
            echo "Use build_type=debug if you only need an installable test APK."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect outputs
        if: success()
        shell: bash
        run: |
          mkdir -p github-build-output
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp -v {} github-build-output/ \;

      - name: Upload APK/AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-${{ inputs.build_type }}-${{ github.run_number }}
          path: github-build-output/*
          if-no-files-found: error
          retention-days: 14
