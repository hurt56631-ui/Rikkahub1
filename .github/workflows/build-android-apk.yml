name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Remove stale files from older overlays
        shell: bash
        run: |
          set -euo pipefail
          # This uploaded feat/context-limit branch contains old main-source files
          # that no longer exist in the current architecture. GitHub overlays do
          # not delete them, so remove them explicitly before compilation.
          rm -f \
            app/src/main/java/me/rerere/rikkahub/ui/di/DataSourceModule.kt \
            app/src/main/java/me/rerere/rikkahub/ui/activity/McpOAuthCallbackActivity.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpOAuthCallback.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpOAuthClient.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/transport/StreamableHttpClientTransport.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/transport/SseClientTransport.kt \
            highlight/src/main/res/raw/prism.js \
            highlight/src/main/java/me/rerere/highlight/HighlightText.kt \
            ai/src/main/java/me/rerere/ai/ProviderManager.kt \
            ai/src/main/java/me/rerere/ai/ProviderSetting.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/GoogleProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/ClaudeProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/OpenAIProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/vertex/ServiceAccountTokenProvider.kt
          rm -f \
            ai/src/main/java/me/rerere/ai/ProviderManager.kt \
            ai/src/main/java/me/rerere/ai/ProviderSetting.kt
          find ai/src/main/java/me/rerere/ai/provider/providers \
            -maxdepth 1 -type f -name '*.kt' ! -name 'ProviderMessageUtils.kt' -delete

      - name: Verify V3 provider source layout
        shell: bash
        run: |
          set -euo pipefail
          test -s ai/src/main/java/me/rerere/ai/ui/StreamChunk.kt || {
            echo 'ERROR: old/mixed RikkaHub source: StreamChunk.kt is missing.'
            exit 1
          }
          grep -q 'Flow<StreamChunk>' ai/src/main/java/me/rerere/ai/provider/Provider.kt || {
            echo 'ERROR: Provider.kt is not the StreamChunk V3 API.'
            exit 1
          }
          test -s ai/src/main/java/me/rerere/ai/provider/providers/geminiweb/GeminiWebProvider.kt || {
            echo 'ERROR: GeminiWebProvider.kt is missing. Upload the complete changed-files package.'
            exit 1
          }
          grep -q 'ProviderSetting.GeminiWeb' ai/src/main/java/me/rerere/ai/provider/ProviderManager.kt || {
            echo 'ERROR: ProviderManager.kt is not the Gemini Web V3 version.'
            exit 1
          }
          grep -q 'data class GeminiWeb' ai/src/main/java/me/rerere/ai/provider/ProviderSetting.kt || {
            echo 'ERROR: ProviderSetting.kt is not the Gemini Web V3 version.'
            exit 1
          }
          if grep -R -n --include='*.kt' '\bMessageChunk\b' ai/src/main/java/me/rerere/ai >/tmp/legacy-messagechunk.txt; then
            echo 'ERROR: legacy MessageChunk API remains:'
            cat /tmp/legacy-messagechunk.txt
            exit 1
          fi

      - name: Verify current app architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/me/rerere/rikkahub/data/ai/GenerationLoop.kt || { echo 'ERROR: GenerationLoop.kt missing; source overlay is incomplete.'; exit 1; }
          test -s app/src/main/java/me/rerere/rikkahub/service/MessageQueue.kt || { echo 'ERROR: MessageQueue.kt missing; source overlay is incomplete.'; exit 1; }
          grep -q 'messageQueue' app/src/main/java/me/rerere/rikkahub/service/ConversationSession.kt || { echo 'ERROR: ConversationSession.kt is still the old version.'; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Restore missing upstream build files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s gradle/libs.versions.toml ]; then
            mkdir -p gradle
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/rikkahub/rikkahub/master/gradle/libs.versions.toml \
              --output gradle/libs.versions.toml
          fi
          test -s gradle/libs.versions.toml

          if [ ! -d material3/material-color-utilities/kotlin ]; then
            rm -rf material3/material-color-utilities
            git clone --depth 1 \
              https://github.com/material-foundation/material-color-utilities.git \
              material3/material-color-utilities
          fi
          test -d material3/material-color-utilities/kotlin

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo 'GOOGLE_SERVICES_JSON is not configured; using build-only dummy config.'
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-local-build",
              "storage_bucket": "rikkahub-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:debug000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyBuildOnlyKey000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:release0000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyBuildOnlyKey000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepare release signing
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_BASE64:-}" ] || [ -z "${SIGNING_CONFIG:-}" ]; then
            echo 'Release requires KEY_BASE64 and SIGNING_CONFIG repository secrets.'
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties

      - name: Compile Debug Kotlin modules first
        if: ${{ inputs.build_type == 'debug' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :ai:compileDebugKotlin :speech:compileDebugKotlin :app:compileDebugKotlin

      - name: Compile Release Kotlin modules first
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :ai:compileReleaseKotlin :speech:compileReleaseKotlin :app:compileReleaseKotlin

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect outputs
        if: success()
        shell: bash
        run: |
          mkdir -p github-build-output
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp -v {} github-build-output/ \;

      - name: Upload APK/AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-${{ inputs.build_type }}-${{ github.run_number }}
          path: github-build-output/*
          if-no-files-found: error
          retention-days: 14
