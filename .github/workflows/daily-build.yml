name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Remove stale files from older overlays
        shell: bash
        run: |
          set -euo pipefail
          # This uploaded feat/context-limit branch contains old main-source files
          # that no longer exist in the current architecture. GitHub overlays do
          # not delete them, so remove them explicitly before compilation.
          rm -f \
            app/src/main/java/me/rerere/rikkahub/ui/di/DataSourceModule.kt \
            app/src/main/java/me/rerere/rikkahub/ui/activity/McpOAuthCallbackActivity.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpOAuthCallback.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpOAuthClient.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/transport/StreamableHttpClientTransport.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/mcp/transport/SseClientTransport.kt \
            highlight/src/main/res/raw/prism.js \
            highlight/src/main/java/me/rerere/highlight/HighlightText.kt \
            ai/src/main/java/me/rerere/ai/ProviderManager.kt \
            ai/src/main/java/me/rerere/ai/ProviderSetting.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/GoogleProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/ClaudeProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/OpenAIProvider.kt \
            ai/src/main/java/me/rerere/ai/provider/providers/vertex/ServiceAccountTokenProvider.kt
          rm -f \
            ai/src/main/java/me/rerere/ai/ProviderManager.kt \
            ai/src/main/java/me/rerere/ai/ProviderSetting.kt
          find ai/src/main/java/me/rerere/ai/provider/providers \
            -maxdepth 1 -type f -name '*.kt' ! -name 'ProviderMessageUtils.kt' -delete
          test -s ai/src/main/java/me/rerere/ai/ui/StreamChunk.kt
          grep -q 'Flow<StreamChunk>' ai/src/main/java/me/rerere/ai/provider/Provider.kt
          test -s ai/src/main/java/me/rerere/ai/provider/providers/geminiweb/GeminiWebProvider.kt
          grep -q 'ProviderSetting.GeminiWeb' ai/src/main/java/me/rerere/ai/provider/ProviderManager.kt
          grep -q 'data class GeminiWeb' ai/src/main/java/me/rerere/ai/provider/ProviderSetting.kt
          if grep -R -n --include='*.kt' '\bMessageChunk\b' ai/src/main/java/me/rerere/ai >/tmp/legacy-messagechunk.txt; then
            cat /tmp/legacy-messagechunk.txt
            exit 1
          fi

      - name: Verify current app architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/me/rerere/rikkahub/data/ai/GenerationLoop.kt || { echo 'ERROR: GenerationLoop.kt missing; source overlay is incomplete.'; exit 1; }
          test -s app/src/main/java/me/rerere/rikkahub/service/MessageQueue.kt || { echo 'ERROR: MessageQueue.kt missing; source overlay is incomplete.'; exit 1; }
          grep -q 'messageQueue' app/src/main/java/me/rerere/rikkahub/service/ConversationSession.kt || { echo 'ERROR: ConversationSession.kt is still the old version.'; exit 1; }

      - name: Restore version catalog and material color utilities
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s gradle/libs.versions.toml ]; then
            mkdir -p gradle
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/rikkahub/rikkahub/master/gradle/libs.versions.toml \
              --output gradle/libs.versions.toml
          fi
          test -s gradle/libs.versions.toml
          if [ ! -d material3/material-color-utilities/kotlin ]; then
            rm -rf material3/material-color-utilities
            git clone --depth 1 \
              https://github.com/material-foundation/material-color-utilities.git \
              material3/material-color-utilities
          fi
          test -d material3/material-color-utilities/kotlin

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Compile Kotlin modules first
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :ai:compileReleaseKotlin :speech:compileReleaseKotlin :app:compileReleaseKotlin

      - name: Gradle Build
        run: ./gradlew --no-daemon assembleRelease

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
